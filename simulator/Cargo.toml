[workspace]
members = [
  "crates/netrunner-sim-core",
  "crates/netrunner-sim-gateway",
  "crates/netrunner-sim-protocol",
  "crates/netrunner-sim-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mtgred/netrunner"

[workspace.dependencies]
criterion = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.bench]
debug = 1
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
